<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Control | Space Portal</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1FY-0zIs4qg0fy3UW-2ivrbJ8TPrgouCm">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-space: #010008;
            --surface: rgba(10, 15, 30, 0.92);
            --neon-cyan: #00f2fe;
            --neon-purple: #9d4edd;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --glow: 0 0 35px rgba(0, 242, 254, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-space); color: var(--text-main); min-height: 100vh; padding: 20px; }

        .admin-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }
        .admin-card { background: var(--surface); backdrop-filter: blur(25px); border: 1px solid var(--neon-cyan); border-radius: 20px; padding: 30px; box-shadow: var(--glow); }
        
        h2 { font-family: 'Orbitron', sans-serif; color: white; font-size: 1.4rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        h2 i { color: var(--neon-cyan); }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.88rem; font-weight: 600; color: var(--text-muted); font-family: 'Orbitron', sans-serif; }
        input, select { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 12px; border-radius: 10px; color: white; font-size: 0.9rem; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,242,254,0.3); }

        .checkbox-group { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-top: 5px; }
        .checkbox-group input { width: 18px; height: 18px; accent-color: var(--neon-cyan); cursor: pointer; }
        .checkbox-group label { cursor: pointer; color: white; font-size: 0.9rem; }

        .btn-neon { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); color: white; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); transition: 0.3s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Orbitron', sans-serif; }
        .btn-neon:hover { box-shadow: 0 0 25px var(--neon-cyan); transform: translateY(-2px); }

        .video-list-box { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; max-height: 400px; overflow-y: auto; }
        .video-item-row { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .video-info h4 { font-size: 0.95rem; color: white; font-family: 'Orbitron', sans-serif; margin-bottom: 4px; }
        .video-info span { font-size: 0.75rem; color: var(--neon-cyan); background: rgba(0,242,254,0.1); padding: 2px 8px; border-radius: 6px; display: inline-block; margin-top: 4px; }
        
        .action-btns-group { display: flex; gap: 8px; }
        .edit-btn { background: rgba(0, 242, 254, 0.15); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 0.8rem; font-family: 'Orbitron', sans-serif; }
        .edit-btn:hover { background: var(--neon-cyan); color: var(--bg-space); }
        .del-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 0.8rem; }
        .del-btn:hover { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" style="color: var(--neon-cyan); text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.9rem;"><i class="fa-solid fa-arrow-left"></i> Back to Portal</a>
            <h1 style="font-family: 'Orbitron', sans-serif; font-size: 1.2rem; color: white;">🎬 Video Control Center (Admin 2)</h1>
        </div>

        <input type="hidden" id="editingVideoId" value="">

        <!-- 1. Add / Edit Video Control Card -->
        <div class="admin-card">
            <h2 id="formHeading"><i class="fa-solid fa-circle-plus"></i> Add Video to Playlist</h2>
            <div class="form-group">
                <label>Video Title / Name</label>
                <input type="text" id="vidTitle" placeholder="যেমন: Quantum Mechanics Breakdown">
            </div>
            <div class="form-group">
                <label>Direct Video URL</label>
                <input type="text" id="vidUrl" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Video Category Type</label>
                <select id="vidCategory">
                    <option value="featured">Featured Science Broadcast</option>
                    <option value="ad">Advertisement (Ad)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Priority Order (ক্রম)</label>
                <input type="number" id="vidPriority" value="1" placeholder="1">
            </div>
            <div class="form-group">
                <label>Duration in Seconds (কত সেকেন্ড চলবে)</label>
                <input type="number" id="vidDuration" value="15" placeholder="15">
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="vidMuted" checked>
                <label for="vidMuted">Mute Video on Autoplay (সাউন্ড মিউট রাখুন)</label>
            </div>
            <button class="btn-neon" id="saveBtn" onclick="saveOrUpdateVideo()"><i class="fa-solid fa-upload"></i> Save Video to Database</button>
        </div>

        <!-- 2. Active Playlist Manager -->
        <div class="admin-card">
            <h2><i class="fa-solid fa-list-check"></i> Active Video Playlist & Editor</h2>
            <div class="video-list-box" id="videoPlaylistContainer">
                <div style="color: var(--text-muted); text-align: center; font-size: 0.85rem;">লোড হচ্ছে...</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zpmptjenzhdjxoiuhfyk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_U3Dj2qRx375nhMyLxuSsgw_7iFHyDeo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allVideosCache = [];

        window.addEventListener('load', () => {
            fetchVideoPlaylist();
        });

        async function saveOrUpdateVideo() {
            const editId = document.getElementById('editingVideoId').value;
            const title = document.getElementById('vidTitle').value.trim();
            const url = document.getElementById('vidUrl').value.trim();
            const category = document.getElementById('vidCategory').value;
            const priority = parseInt(document.getElementById('vidPriority').value) || 1;
            const duration = parseInt(document.getElementById('vidDuration').value) || 15;
            const isMuted = document.getElementById('vidMuted').checked;

            if(!title || !url) {
                alert('দয়া করে ভিডিওর নাম এবং ইউআরএল দিন!');
                return;
            }

            const videoPayload = {
                title: title,
                video_url: url,
                category: category,
                priority: priority,
                duration: duration,
                is_muted: isMuted
            };

            if (editId) {
                // আপডেট করার সময় id ম্যাচ করে ডাটা পাঠাতে হবে
                const { error } = await _supabase.from('site_videos').update(videoPayload).eq('id', Number(editId));
                if (!error) {
                    alert('ভিডিও সফলভাবে আপডেট করা হয়েছে!');
                    resetForm();
                    fetchVideoPlaylist();
                } else {
                    alert('আপডেট করতে সমস্যা হয়েছে: ' + (error.message || ''));
                }
            } else {
                const { error } = await _supabase.from('site_videos').insert([videoPayload]);
                if (!error) {
                    alert('সফলভাবে নতুন ভিডিও যুক্ত হয়েছে!');
                    resetForm();
                    fetchVideoPlaylist();
                } else {
                    alert('সেভ করতে সমস্যা হয়েছে: ' + (error.message || ''));
                }
            }
        }

        async function fetchVideoPlaylist() {
            const container = document.getElementById('videoPlaylistContainer');
            const { data, error } = await _supabase.from('site_videos').select('*').order('priority', { ascending: true });

            if(data && data.length > 0) {
                allVideosCache = data;
                container.innerHTML = '';
                data.forEach(v => {
                    let muteStatus = v.is_muted ? 'Muted' : 'Unmuted';
                    let dur = v.duration || 15;
                    container.innerHTML += `
                        <div class="video-item-row">
                            <div class="video-info">
                                <h4>${v.title}</h4>
                                <span>${v.category.toUpperCase()} | Priority: ${v.priority} | Duration: ${dur}s | Sound: ${muteStatus}</span>
                            </div>
                            <div class="action-btns-group">
                                <button class="edit-btn" onclick="loadVideoForEdit('${v.id}')"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                                <button class="del-btn" onclick="deleteVideo('${v.id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });
            } else {
                allVideosCache = [];
                container.innerHTML = `<div style="color: var(--text-muted); text-align: center; font-size: 0.85rem;">কোনো ভিডিও নেই।</div>`;
            }
        }

        function loadVideoForEdit(id) {
            const v = allVideosCache.find(item => String(item.id) === String(id));
            if(!v) return;

            document.getElementById('editingVideoId').value = v.id;
            document.getElementById('vidTitle').value = v.title;
            document.getElementById('vidUrl').value = v.video_url;
            document.getElementById('vidCategory').value = v.category;
            document.getElementById('vidPriority').value = v.priority;
            document.getElementById('vidDuration').value = v.duration || 15;
            document.getElementById('vidMuted').checked = v.is_muted !== undefined ? v.is_muted : true;

            document.getElementById('formHeading').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Edit Video Details`;
            document.getElementById('saveBtn').innerHTML = `<i class="fa-solid fa-check"></i> Update Video Data`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('editingVideoId').value = '';
            document.getElementById('vidTitle').value = '';
            document.getElementById('vidUrl').value = '';
            document.getElementById('vidPriority').value = '1';
            document.getElementById('vidDuration').value = '15';
            document.getElementById('vidMuted').checked = true;
            document.getElementById('formHeading').innerHTML = `<i class="fa-solid fa-circle-plus"></i> Add Video to Playlist`;
            document.getElementById('saveBtn').innerHTML = `<i class="fa-solid fa-upload"></i> Save Video to Database`;
        }

        async function deleteVideo(id) {
            if(confirm('আপনি কি এই ভিডিওটি ডিলিট করতে চান?')) {
                const { error } = await _supabase.from('site_videos').delete().eq('id', Number(id));
                if (!error) {
                    fetchVideoPlaylist();
                } else {
                    alert('ডিলিট করতে সমস্যা হয়েছে।');
                }
            }
        }
    </script>
</body>
</html>
